[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.2.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
robsidian-core = { path = "crates/core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# GUIはデバッグビルドでも実用的な速度で動くよう依存だけ最適化する
[profile.dev.package."*"]
opt-level = 2
