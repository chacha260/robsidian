[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]
# 取り込んだ外部のクレート（手を入れたもの）。fmt と clippy の対象にしない
exclude = ["vendor", "examples"]

[workspace.package]
version = "0.2.16"
edition = "2021"
license = "MIT"

[workspace.dependencies]
robsidian-core = { path = "crates/core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# GUIはデバッグビルドでも実用的な速度で動くよう依存だけ最適化する
[profile.dev.package."*"]
opt-level = 2

# egui_commonmark の描画部分に、プレビューのリンクのホバーを知らせる口を足したもの（vendor/README.md）
[patch.crates-io]
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }
