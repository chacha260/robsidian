# Robsidian の WASM のプラグインの例（Rust）。
#   cargo build --release --target wasm32-unknown-unknown
#   cp target/wasm32-unknown-unknown/release/wasm_headings.wasm plugin.wasm
[package]
name = "wasm-headings"
version = "0.1.0"
edition = "2021"
publish = false

# Robsidian 本体のワークスペースとは別に作る
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
