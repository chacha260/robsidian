[package]
name = "robsidian"
description = "Native Markdown note app for Obsidian-compatible vaults"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
robsidian-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "file"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "load-images", "better_syntax_highlighting"] }
egui-file-dialog = { version = "0.16", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
similar = "2"
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
notify = "8"
trash = "5"
dirs = "6"
# フォントの縦の寸法を読む（egui が使うのと同じ版。ベースラインをそろえるため）
skrifa = { version = "0.44", default-features = false, features = ["std"] }
cpal = "0.18.2"
hound = "3.5.1"

[dev-dependencies]
tempfile = "3"
